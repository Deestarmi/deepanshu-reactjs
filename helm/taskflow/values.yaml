# ──────────────────────────────────────────────
#  TaskFlow Helm Values
#  Edit YOUR_DOCKERHUB_USERNAME before deploying
# ──────────────────────────────────────────────

frontend:
  image:
    repository: YOUR_DOCKERHUB_USERNAME/taskflow-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: LoadBalancer   # Gets a public IP from Azure
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

backend:
  image:
    repository: YOUR_DOCKERHUB_USERNAME/taskflow-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP      # Internal only — frontend proxies to it
    port: 3001
  env:
    APP_VERSION: "1.0.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
